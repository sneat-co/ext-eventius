name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Build
        working-directory: backend
        run: go build ./...
      - name: Test
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          go test ./... -coverprofile=coverage.out
          coverage="$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')"
          floor="$(tr -d '[:space:]' < coverage_floor.txt)"
          awk -v coverage="$coverage" -v floor="$floor" 'BEGIN { exit !(coverage >= floor) }' || {
            echo "coverage ${coverage}% is below floor ${floor}%" >&2
            exit 1
          }
